root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./bin/media-manager ./cmd/run/"
  bin = "bin/media-manager"
  full_bin = "APP_ENV=dev APP_USER=air ./bin/media-manager"
  include_ext = ["go", "tpl", "tmpl", "html"]
  exclude_dir = ["assets", "tmp", "vendor", "widget", "dashboard", "bin"]
  delay = 1000
  stop_on_error = true
  kill_delay = "500ms"

[log]
  time = false

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true
