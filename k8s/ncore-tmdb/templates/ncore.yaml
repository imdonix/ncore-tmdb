{{- if .Values.ncore.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ncore
  labels:
    app.kubernetes.io/name: ncore
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ncore
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ncore
    spec:
      containers:
        - name: ncore
          image: "{{ .Values.ncore.image.repository }}:{{ .Values.ncore.image.tag }}"
          imagePullPolicy: {{ .Values.ncore.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: ncore
  labels:
    app.kubernetes.io/name: ncore
spec:
  type: {{ .Values.ncore.service.type }}
  ports:
    - port: {{ .Values.ncore.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: ncore
{{- end }}
