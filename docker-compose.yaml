services:
  ncore:
    image: imdonix/ncore
    container_name: ncore
    ports:
      - "1001:8080"
    networks:
      - app-network
    restart: unless-stopped

  qbit:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbit
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - WEBUI_PORT=1002
    volumes:
      - ./tmp/qbit_config:/config
      - ./tmp/qbit_downloads:/downloads
    ports:
      - "1002:1002"
      - "6881:6881"
      - "6881:6881/udp"
    networks:
      - app-network
    restart: unless-stopped

  ncore-tmdb:
    build: .
    container_name: ncore-tmdb
    environment:
      - TMDB_API_KEY=${TMDB_API_KEY}
      - NCORE_HOST=http://ncore:8080
      - NCORE_USER=${NCORE_USER}
      - NCORE_PASS=${NCORE_PASS}
      - QBIT_HOST=http://qbit:1002
      - QBIT_USER=admin
      - QBIT_PASS=adminadmin
    volumes:
      - ./tmp/ncore-tmdb:/app/data
    ports:
      - "8080:8080"
    networks:
      - app-network
    depends_on:
      - ncore
      - qbit
    tty: true

networks:
  app-network:
    driver: bridge
