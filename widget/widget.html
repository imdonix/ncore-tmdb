<div class="panel top_billed scroller">
    <h3 dir="auto">Download using Torrent</h3>
    <div class="season card">
        <div class="content">
            <div id="widget-torrent"></div>
        </div>
    </div>
</div>

<style>
    .loading {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 20px;
        color: #999;
    }

    .error {
        padding: 20px;
        color: #e74c3c;
    }

    .empty {
        padding: 20px;
        color: #999;
    }

    .torrent-item {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .provider-icon {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
    }

    .torrent-item a {
        color: #fff;
        text-decoration: none;
        font-size: 14px;
        flex-grow: 1;
    }

    .torrent-item a:hover {
        text-decoration: underline;
    }

    .download-actions {
        display: flex;
        gap: 8px;
        align-items: center;
    }

    .action-btn {
        background: none;
        border: none;
        color: #3498db;
        cursor: pointer;
        padding: 0;
        font-size: 12px;
    }

    .action-btn:hover {
        text-decoration: underline;
    }

    .fallback-link {
        color: #95a5a6;
        font-size: 12px;
        text-decoration: none;
    }

    .fallback-link:hover {
        text-decoration: underline;
    }

    .status-msg {
        font-size: 12px;
        color: #2ecc71;
        margin-left: 8px;
    }
</style>

<script type="module">
    import { h, render } from 'https://esm.sh/preact';
    import { useState, useEffect } from 'https://esm.sh/preact/hooks';
    import htm from 'https://esm.sh/htm';

    const html = htm.bind(h);

    const PROVIDER_ICONS = {
        NCORE: '/widget/ncore.png'
    };

    const URL_FETCH = `/api/#CONTENT_TYPE#/#CONTENT_TMDBID#`;

    (() => {
        function TorrentWidget() {
            const [torrents, setTorrents] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [status, setStatus] = useState({});

            useEffect(() => {
                const fetchTorrents = async () => {
                    try {
                        const resp = await fetch(URL_FETCH);
                        if (!resp.ok) throw new Error('Network response was not ok');
                        const data = await resp.json();
                        setTorrents(data.torrents || []);
                        setLoading(false);
                    } catch (err) {
                        console.error('Failed to fetch torrents:', err);
                        setError(err.message);
                        setLoading(false);
                    }
                };
                fetchTorrents();
            }, []);

            const handleDownload = async (id) => {
                try {
                    setStatus({ ...status, [id]: 'Scheduling...' });
                    const resp = await fetch(`/api/qbit/download/${id}`);
                    if (!resp.ok) {
                        const data = await resp.json();
                        throw new Error(data.error || 'Failed to schedule');
                    }
                    setStatus({ ...status, [id]: 'Scheduled!' });
                } catch (err) {
                    console.error('Failed to schedule download:', err);
                    setStatus({ ...status, [id]: `Error: ${err.message}` });
                }
            };

          if (loading) {
              return html`
                  <div class="loading">
                      <span>Loading torrents...</span>
                  </div>`;
          }

            if (error) {
                return html`<div class="error">Error loading torrents: ${error}</div>`;
            }

            if (torrents.length === 0) {
                return html`<div class="empty">No torrents found.</div>`;
            }

            return html`
                <div id="torrent-list">
                    ${torrents.map((t) =>
                        html`<div key=${t.ID} class="torrent-item">
                            <img
                                class="provider-icon"
                                src=${PROVIDER_ICONS[t.Provider] || ''}
                                alt=${t.Provider || ''}
                                title=${t.Provider || ''}
                            />
                            <a
                                href="javascript:void(0)"
                                onClick=${() => handleDownload(t.ID)}
                            >
                                ${t.Title} [S:${t.Seeders} L:${t.Leechers}]
                            </a>
                            <div class="download-actions">
                                <a
                                    class="fallback-link"
                                    href=${`/api/download/${t.ID}`}
                                    target="_blank"
                                    rel="noopener"
                                    title="Download .torrent file"
                                >
                                    💾
                                </a>
                                ${status[t.ID] && html`<span class="status-msg">${status[t.ID]}</span>`}
                            </div>
                        </div>`
                    )}
                </div>
            `;
        }

        render(html`<${TorrentWidget} />`, document.getElementById('widget-torrent'));
    })();
</script>
