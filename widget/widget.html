<section class="panel top_billed scroller">
    <h3 dir="auto">Download using Torrent</h3>
    <div class="season card">
        <div id="widget-torrent" class="content" >
        </div>
    </div>
</div>

<script type="module">
    import { h, render } from 'https://esm.sh/preact';
    import { useState, useEffect, useRef } from 'https://esm.sh/preact/hooks';
    import htm from 'https://esm.sh/htm';

    const html = htm.bind(h);

    const PROVIDER_ICONS = {
        NCORE: '/widget/ncore.png'
    };

    const URL_FETCH = `/api/#CONTENT_TYPE#/#CONTENT_TMDBID#`;

    (() => {
        function TorrentWidget() {
            const [data, setData] = useState({ torrents: [], activeDownload: null });
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [localScheduling, setLocalScheduling] = useState(null);
            const pollInterval = useRef(null);

            const fetchTorrents = async () => {
                try {
                    const resp = await fetch(URL_FETCH);
                    if (!resp.ok) throw new Error('Network response was not ok');
                    const json = await resp.json();

                    setData(json);
                    setLoading(false);

                    // If we see an active download from the server, clear our local optimistic state
                    if (json.activeDownload) {
                        setLocalScheduling(null);
                    }

                    if (json.activeDownload && !pollInterval.current) {
                        startPolling();
                    } else if (!json.activeDownload && pollInterval.current) {
                        stopPolling();
                    }
                } catch (err) {
                    console.error('Failed to fetch torrents:', err);
                    setError(err.message);
                    setLoading(false);
                }
            };

            const startPolling = () => {
                if (pollInterval.current) return;
                pollInterval.current = setInterval(fetchTorrents, 5000);
            };

            const stopPolling = () => {
                if (pollInterval.current) {
                    clearInterval(pollInterval.current);
                    pollInterval.current = null;
                }
            };

            useEffect(() => {
                fetchTorrents();
                return () => stopPolling();
            }, []);

            const handleAction = async (e, t) => {
                if (e.ctrlKey) {
                    // Direct download
                    window.open(`/api/download/${t.ID}`, '_blank');
                    return;
                }

                try {
                    // Instant feedback: set local optimistic state
                    setLocalScheduling(t.Title);

                    const resp = await fetch(`/api/qbit/download/${t.ID}`);
                    if (!resp.ok) {
                        const errData = await resp.json();
                        throw new Error(errData.error || 'Failed to schedule');
                    }

                    // Trigger immediate refresh and start polling
                    fetchTorrents();
                    startPolling();
                } catch (err) {
                    console.error('Failed to schedule download:', err);
                    alert(`Error: ${err.message}`);
                    setLocalScheduling(null);
                }
            };

          if (loading) {
              return html`
                  <div class="loading">
                      <span>Loading torrents...</span>
                  </div>`;
          }

            if (error) {
                return html`<div class="error">Error loading torrents: ${error}</div>`;
            }

            const { torrents, activeDownload } = data;

            if (torrents.length === 0) {
                return html`<div class="empty">No torrents found.</div>`;
            }

            return html`
                <div id="torrents" class="torrent-list">
                    ${torrents.map((t) => {
                        const isDownloading = activeDownload && activeDownload.id === t.Title;
                        const isScheduling = localScheduling === t.Title;

                        return html`<div key=${t.ID} class="torrent-item">
                            <div class="torrent-info">
                                <img
                                    class="provider-icon"
                                    src=${PROVIDER_ICONS[t.Provider] || ''}
                                    alt=${t.Provider || ''}
                                    title=${t.Provider || ''}
                                />
                                <a
                                    href="javascript:void(0)"
                                    onClick=${(e) => handleAction(e, t)}
                                    class="torrent-title"
                                    style="${isScheduling ? 'opacity: 0.5; cursor: wait;' : ''}"
                                    title="Click to schedule download, Ctrl+Click to download file"
                                >
                                    ${t.Title}
                                </a>
                                <div class="torrent-meta">
                                    <span class="meta-item date" title="Upload Date">
                                        <svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/></svg>
                                        ${t.Date}
                                    </span>
                                    <span class="meta-item seeders" title="Seeders">
                                        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14V9.41l-2.29 2.29-1.42-1.42L12 5.58l4.71 4.71-1.42 1.42L13 9.41V16h-2z"/></svg>
                                        ${t.Seeders}
                                    </span>
                                    <span class="meta-item leechers" title="Leechers">
                                        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 8v6.59l2.29-2.29 1.42 1.42L12 18.42l-4.71-4.71 1.42-1.42L11 16.59V10h2z"/></svg>
                                        ${t.Leechers}
                                    </span>
                                </div>
                            </div>
                            ${(isDownloading || isScheduling) && html`
                                <div class="progress-container" title="${isScheduling ? 'Scheduling...' : activeDownload.status}">
                                    <div class="progress-bar ${isScheduling ? 'shim' : ''}" style="width: ${isScheduling ? '100%' : activeDownload.progress}%"></div>
                                    <div class="progress-text">${isScheduling ? '...' : Math.round(activeDownload.progress) + '%'}</div>
                                </div>
                            `}
                        </div>`;
                    })}
                </div>
            `;
        }

        render(html`<${TorrentWidget} />`, document.getElementById('widget-torrent'));
    })();
</script>

<style>
    .loading {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 20px;
        color: #999;
    }

    .error {
        padding: 20px;
        color: #e74c3c;
    }

    .empty {
        padding: 20px;
        color: #999;
    }

    .torrent-list {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 5px 0;
    }

    .torrent-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 6px 8px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.02);
        transition: background 0.2s;
    }

    .torrent-item:hover {
        background: rgba(255, 255, 255, 0.06);
    }

    .torrent-info {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-grow: 1;
        min-width: 0;
    }

    .provider-icon {
        width: 14px;
        height: 14px;
        flex-shrink: 0;
    }

    .torrent-title {
        color: #e3e3e3;
        text-decoration: none;
        font-size: 13px;
        font-weight: 400;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex-grow: 1;
    }

    .torrent-title:hover {
        color: #fff;
        text-decoration: underline;
    }

    .torrent-meta {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
        margin-left: 8px;
    }

    .meta-item {
        display: flex;
        align-items: center;
        gap: 3px;
        font-size: 11px;
        color: #888;
    }

    .meta-item svg {
        width: 11px;
        height: 11px;
        fill: currentColor;
    }

    .meta-item.seeders {
        color: #2ecc71;
        min-width: 35px;
    }

    .meta-item.leechers {
        color: #e74c3c;
        min-width: 35px;
    }

    .meta-item.date {
        color: #666;
    }

    .progress-container {
        width: 60px;
        background-color: #222;
        border-radius: 8px;
        height: 10px;
        position: relative;
        overflow: hidden;
        flex-shrink: 0;
    }

    .progress-bar {
        height: 100%;
        background: linear-gradient(90deg, #2ecc71, #27ae60);
        transition: width 0.3s ease;
    }

    .progress-bar.shim {
        background: linear-gradient(90deg, #2ecc71 0%, #27ae60 50%, #2ecc71 100%);
        background-size: 200% 100%;
        animation: shimmy 2s infinite linear;
    }

    @keyframes shimmy {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
    }

    .progress-text {
        position: absolute;
        width: 100%;
        text-align: center;
        top: 0;
        left: 0;
        line-height: 10px;
        font-size: 8px;
        color: #fff;
        font-weight: bold;
    }
</style>
